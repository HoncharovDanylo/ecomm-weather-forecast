name: Lab 3 Grading

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER_LC}/ecommerce-app" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image locally
        run: |
          docker build -t ${{ steps.image.outputs.name }}:latest \
            -f WeatherForecast.Api/Dockerfile .

      - name: Create KinD cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: lab3-cluster

      - name: Load image into KinD
        run: |
          kind load docker-image ${{ steps.image.outputs.name }}:latest --name lab3-cluster

      - name: Apply all Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Wait for Postgres to be ready
        run: kubectl rollout status deployment/postgres --timeout=60s

      - name: Wait for app to be ready
        run: kubectl rollout status deployment/ecommerce-app --timeout=120s

      - name: Run Grading Script
        run: |
          chmod +x ./Tests/lab3_test.sh
          ./Tests/lab3_test.sh
