replicaCount: 2

image:
  repository: ghcr.io/honcharovdanylo/ecommerce-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

configMap:
  dbHost: "postgres-service"
  dbName: "forecast"
  dbPort: "5432"
  aspnetUrls: "http://+:80"
  isHangfireDashboardEnabled: "true"
  isSwaggerDisabled: "false"
  telegramIntegrationEnabled: "true"
  telegramBotApi: "https://api.telegram.org/bot"
  openWeatherUrl: "https://api.openweathermap.org/data/2.5/"

secret:
  dbPassword: "admin"
  connectionString: "Host=postgres-service;Port=5432;Database=forecast;Username=postgres;Password=admin"
  geocodingApiKey: "mock_geocoding_key"
  openWeatherApiKey: "mock_openweather_key"
  telegramBotToken: "mock_telegram_token"
  internalApiKey: "mock_internal_key"

postgres:
  image: postgres:15-alpine
  dbUser: "postgres"
  dbName: "forecast"
